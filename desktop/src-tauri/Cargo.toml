[package]
name = "remy-bureau"
version = "0.1.0"
description = "Rémy sur Windows : la fenêtre de la tour, la zone de notification, Noter au clavier"
authors = ["Rémy"]
license = "MIT"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
# Le nom de la bibliothèque diffère du binaire (piège connu de Cargo sous Windows).
name = "remy_bureau_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-window-state = "=2.5.0"
auto-launch = "=0.6.0"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-notification = "=2.8.0"
tauri-plugin-opener = "=2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
# Petit binaire : l'installateur reste léger.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_Security_Cryptography"] }
