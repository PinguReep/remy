# Tests du serveur (Lot 0, J0.3) : à chaque push et à chaque PR, et avant tout
# envoi TestFlight (appelé par ios-testflight.yml). Aucun secret, aucun service
# réel : `npm test` pose REMY_ENV=test, et le code refuse alors toute requête
# vers une API Motion qui n'est pas locale.
#
# Deux machines : Ubuntu (rapide), et Windows comme la tour — c'est là que
# tourne la production (chemins, renommages, fsync, PowerShell 5.1).

name: Serveur — tests

# Une fois par changement : sur une PR, et sur main après fusion. (Avant, chaque
# envoi sur une branche de PR lançait deux fois tout — push ET pull_request —
# et le job Windows compte double dans le quota de minutes.)
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: serveur-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: npm test (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  windows:
    name: npm test + installeur (Windows, comme la tour)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Scripts de la tour — syntaxe (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $echec = $false
          foreach ($f in Get-ChildItem scripts, test\outils -Filter *.ps1) {
            $erreurs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$erreurs) | Out-Null
            if ($erreurs) { $echec = $true; $erreurs | ForEach-Object { Write-Error "$($f.Name):$($_.Extent.StartLineNumber): $($_.Message)" } }
            else { Write-Output "$($f.Name) : syntaxe valide ($($PSVersionTable.PSVersion))" }
          }
          if ($echec) { exit 1 }
      - name: Scripts de la tour — pièges de PowerShell 5.1
        shell: powershell
        run: |
          # Le piège : en mode « Stop », rediriger la sortie d'erreur d'un
          # programme (2>$null) l'arrête à la première ligne écrite. Node 22
          # écrit « ExperimentalWarning » quand on charge SQLite.
          $ErrorActionPreference = 'Stop'
          $piege = $false
          try { & node -e "require('node:sqlite')" 2>$null } catch { $piege = $true }
          Write-Output "Piège présent sous $($PSVersionTable.PSVersion) : $piege"
          # Ce que font les scripts de la tour : ne doit JAMAIS s'arrêter.
          $ErrorActionPreference = 'Continue'
          & node --no-warnings -e "try { require('node:sqlite'); process.exit(0) } catch { process.exit(1) }" 2>$null
          $nodeOk = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = 'Stop'
          if (-not $nodeOk) { Write-Error "La vérification de Node de l'installeur échoue alors que Node 22 est là"; exit 1 }
          Write-Output "Vérification de Node de l'installeur : OK"
          # Un programme qui écrit sur sa sortie d'erreur sans redirection : affiché, pas fatal.
          & node -e "console.error('avertissement sans gravité')"
          Write-Output "Sortie d'erreur non redirigée : OK"
          # Extrait sous Windows, le script du Spark doit rester en fins de ligne
          # Unix : en CRLF, bash s'arrête dès « set -o pipefail ».
          if ([IO.File]::ReadAllBytes('scripts/spark-preparer.sh') -contains 13) { Write-Error 'spark-preparer.sh extrait en CRLF'; exit 1 }
          Write-Output "spark-preparer.sh en fins de ligne Unix (core.autocrlf = $(git config core.autocrlf)) : OK"
      - name: Mise à jour automatique — un passage complet par powershell.exe
        shell: powershell
        run: |
          # scripts\maj-auto.mjs contre un faux GitHub et un faux Remy, avec un
          # faux installeur .ps1 lancé comme le vrai (powershell -File) : codes de
          # sortie, raison laissée en UTF-8, retour en arrière, refus, verrou.
          $ErrorActionPreference = 'Continue'
          & node test\outils\essai-maj-auto.mjs --installeur test\outils\faux-installeur.ps1
          if ($LASTEXITCODE -ne 0) { Write-Error "Essai de la mise a jour automatique : code $LASTEXITCODE"; exit 1 }
      - name: Mise à jour automatique — la tâche planifiée, posée puis retirée par l'installeur
        shell: powershell
        run: |
          # Motifs sans accent : Windows PowerShell 5.1 lit cette étape en ANSI.
          $ErrorActionPreference = 'Stop'
          # Un profil à part : l'installeur n'y trouve qu'une copie de production.
          $profil = Join-Path $env:RUNNER_TEMP 'profil-remy'
          $env:USERPROFILE = $profil
          $base = Join-Path $profil '.remy'
          $app = Join-Path $base 'app'
          New-Item -ItemType Directory -Force $base | Out-Null
          $ErrorActionPreference = 'Continue'
          & git clone --quiet . $app 2>&1 | Out-Null
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path (Join-Path $app 'scripts\maj-auto.mjs'))) { Write-Error 'Copie de production non preparee'; exit 1 }
          $installeur = 'scripts\installer-tour.ps1'
          $trouver = { Get-ScheduledTask | Where-Object { $_.TaskName -like 'R*my - mise * jour' } }
          # (Write-Host : seule la valeur rendue sort de la fonction ; « Continue » :
          # la sortie d'erreur d'un programme redirigée ne doit pas arrêter l'étape.)
          function Lancer($drapeau) {
            $ErrorActionPreference = 'Continue'
            $sortie = @(powershell -NoProfile -ExecutionPolicy Bypass -File $installeur $drapeau 2>&1 | ForEach-Object { "$_" })
            $code = $LASTEXITCODE
            $sortie | ForEach-Object { Write-Host "    $_" }
            return [pscustomobject]@{ Code = $code; Sortie = ($sortie -join "`n") }
          }
          # Apres -Uninstall : code 0, le message de desinstallation, et RIEN
          # d'autre (ni sauvegarde, ni version notee, ni verrou, ni installation).
          # Le 12/11, un trap faisait sauter le return du bloc -Uninstall quand
          # tailscale manquait : l'installeur deroulait une installation.
          function Verifier-Desinstallation($r, $cas) {
            if ($r.Code -ne 0) { Write-Error "$cas : code $($r.Code)"; exit 1 }
            if ($r.Sortie -notmatch 'sinstall') { Write-Error "$cas : pas de message de desinstallation"; exit 1 }
            if ($r.Sortie -match 'Sauvegarde|Indique la version|Node |npm|Version introuvable|tourne :') { Write-Error "$cas : l'installeur a continue apres la desinstallation"; exit 1 }
            foreach ($f in 'version-precedente.txt', 'maj-auto\verrou.json', 'run-remy.ps1') {
              if (Test-Path (Join-Path $base $f)) { Write-Error "$cas : $f ecrit, une installation a ete lancee"; exit 1 }
            }
            if (& $trouver) { Write-Error "$cas : tache toujours la"; exit 1 }
          }
          # 0. Deux drapeaux contraires : refus, rien de pose.
          $ErrorActionPreference = 'Continue'
          powershell -NoProfile -ExecutionPolicy Bypass -File $installeur -MiseAJourAuto -SansMiseAJourAuto 2>&1 | Out-Null
          $codeContraires = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($codeContraires -eq 0 -or (& $trouver)) { Write-Error 'Drapeaux contraires acceptes'; exit 1 }
          # 1. -MiseAJourAuto, seul : la tache, ses declencheurs, ses droits.
          if ((Lancer '-MiseAJourAuto').Code -ne 0) { Write-Error '-MiseAJourAuto a echoue'; exit 1 }
          $t = & $trouver
          if (-not $t) { Write-Error 'Tache de mise a jour absente'; exit 1 }
          Write-Output "Tache : $($t.TaskName) ; droits $($t.Principal.RunLevel) ; $($t.Principal.LogonType)"
          if ($t.Principal.RunLevel -ne 'Highest') { Write-Error 'La tache doit avoir les droits les plus eleves (remplacer la tache Remy sans invite)'; exit 1 }
          $ouverture = $t.Triggers | Where-Object { $_.CimClass.CimClassName -eq 'MSFT_TaskLogonTrigger' }
          $horloge = $t.Triggers | Where-Object { $_.CimClass.CimClassName -eq 'MSFT_TaskTimeTrigger' }
          if (-not $ouverture -or $ouverture.Delay -ne 'PT5M') { Write-Error "Declencheur d'ouverture de session absent ou sans delai de 5 min"; exit 1 }
          if (-not $horloge -or $horloge.Repetition.Interval -ne 'PT15M') { Write-Error 'Repetition toutes les 15 min absente'; exit 1 }
          $duree = $horloge.Repetition.Duration
          Write-Output "Repetition : $($horloge.Repetition.Interval), duree [$duree] (vide : sans fin)"
          if ($duree -and ([System.Xml.XmlConvert]::ToTimeSpan($duree)).TotalDays -lt 365) { Write-Error "Repetition limitee a $duree"; exit 1 }
          if ($t.Settings.MultipleInstances -ne 'IgnoreNew') { Write-Error 'Deux passages a la fois possibles'; exit 1 }
          if (-not ((($t.Actions | ForEach-Object { $_.Arguments }) -join ' ').Contains('run-maj-auto.ps1'))) { Write-Error 'La tache ne lance pas run-maj-auto.ps1'; exit 1 }
          $marque = Get-Content (Join-Path $base 'maj-auto\tache.json') -Raw | ConvertFrom-Json
          if (-not $marque.active) { Write-Error 'tache.json absent'; exit 1 }
          # 2. Le lanceur ecrit par l'installeur : syntaxe 5.1, puis un passage
          #    reel, coupe par remy.env (REMY_MAJ_AUTO=off) : rien n'est installe.
          $lanceur = Join-Path $base 'run-maj-auto.ps1'
          $erreurs = $null
          [System.Management.Automation.Language.Parser]::ParseFile($lanceur, [ref]$null, [ref]$erreurs) | Out-Null
          if ($erreurs) { Write-Error "run-maj-auto.ps1 : $($erreurs[0].Message)"; exit 1 }
          [IO.File]::WriteAllText((Join-Path $base 'remy.env'), "REMY_MAJ_AUTO=off`nSESSION_SECRET=ci`n")
          $ErrorActionPreference = 'Continue'
          powershell -NoProfile -ExecutionPolicy Bypass -File $lanceur 2>&1 | ForEach-Object { Write-Output "    $_" }
          $codeLanceur = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          $etat = Get-Content (Join-Path $base 'maj-auto\etat.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          Write-Output "Passage par le lanceur : code $codeLanceur, etat $($etat.etat)"
          if ($codeLanceur -ne 0 -or $etat.etat -ne 'coupee') { Write-Error 'Le lanceur de la tache ne fait pas son passage'; exit 1 }
          # 3. -SansMiseAJourAuto la retire.
          if ((Lancer '-SansMiseAJourAuto').Code -ne 0) { Write-Error '-SansMiseAJourAuto a echoue'; exit 1 }
          if ((& $trouver) -or (Test-Path (Join-Path $base 'maj-auto\tache.json'))) { Write-Error 'Tache toujours la apres -SansMiseAJourAuto'; exit 1 }
          # 4. -Uninstall la retire aussi, et s'arrete la (tailscale absent du runner).
          if ((Lancer '-MiseAJourAuto').Code -ne 0) { Write-Error '-MiseAJourAuto (2) a echoue'; exit 1 }
          Verifier-Desinstallation (Lancer '-Uninstall') '-Uninstall sans tailscale'
          # 5. -Uninstall sans node, git ni tailscale dans le PATH : jamais d'installation.
          if ((Lancer '-MiseAJourAuto').Code -ne 0) { Write-Error '-MiseAJourAuto (3) a echoue'; exit 1 }
          $cheminAvant = $env:Path
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          foreach ($o in 'node', 'git', 'tailscale') { if (Get-Command $o -ErrorAction SilentlyContinue) { Write-Error "$o encore dans le PATH reduit"; exit 1 } }
          $r = Lancer '-Uninstall'
          $env:Path = $cheminAvant
          Verifier-Desinstallation $r '-Uninstall sans node, git ni tailscale'
          Write-Output 'Tache de mise a jour : posee, lancee, retiree (-SansMiseAJourAuto, -Uninstall) ; -Uninstall ne lance jamais rien d autre : OK'
      - name: Spark — empreinte relevée par l'OpenSSH de Windows
        shell: powershell
        run: |
          # Comme sur la tour : l'OpenSSH livré avec Windows, pas celui de Git.
          $env:Path = "$env:WINDIR\System32\OpenSSH;$env:Path"
          Write-Output "ssh : $((Get-Command ssh).Source)"
          $sortie = powershell -NoProfile -ExecutionPolicy Bypass -File scripts\spark-relier.ps1 -Spark github.com -Relever
          $code = $LASTEXITCODE
          $sortie | ForEach-Object { Write-Output $_ }
          # Empreinte ed25519 publiée par GitHub (docs.github.com, « GitHub's SSH key fingerprints »).
          if ($code -ne 0 -or -not ($sortie -match 'SHA256:\+DiY3wvvV6TuJJhbpZisF/zLDA0zPMSvHdkr4UvCOqU')) { Write-Error 'Empreinte non relevée ou différente'; exit 1 }
          if (Test-Path "$env:USERPROFILE\.remy\spark_hotes_connus*") { Write-Error 'Le relevé a laissé un fichier'; exit 1 }
          Write-Output 'Relevé par ssh : OK, rien épinglé'
          # Pour mémoire : ce que donne ssh-keyscan sur ce Windows.
          $ErrorActionPreference = 'Continue'
          $ks = & ssh-keyscan -t ed25519 github.com 2>&1
          Write-Output "Pour mémoire, ssh-keyscan : [$($ks -join ' | ')] (code $LASTEXITCODE)"
          exit 0
      - name: BitLocker — état en lecture seule, sans jamais une clé
        shell: powershell
        run: |
          $sortie = powershell -NoProfile -ExecutionPolicy Bypass -File scripts\bitlocker-etat.ps1
          $code = $LASTEXITCODE
          $sortie | ForEach-Object { Write-Output $_ }
          if ($code -ne 0) { Write-Error "bitlocker-etat.ps1 : code $code"; exit 1 }
          # Une clé de récupération : 8 groupes de 6 chiffres.
          if ($sortie -match '\d{6}(-\d{6}){7}') { Write-Error 'Une clé de récupération apparaît dans la sortie'; exit 1 }
          # Motif sans accent : Windows PowerShell 5.1 lit cette étape en ANSI.
          if (-not ($sortie -match '^Fin : rien n')) { Write-Error 'Le script ne va pas jusqu''au bout'; exit 1 }
          Write-Output 'État BitLocker : lu jusqu''au bout, aucune clé affichée'
