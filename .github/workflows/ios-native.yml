# App iPhone native : compile, teste le cœur, lance l'app sur un simulateur
# contre un serveur de démo (données fictives) et capture les écrans.
# Aucune signature, aucun envoi : c'est la vérification de chaque changement.
# Les captures sont dans les « artifacts » de l'exécution.
#
# Relancé aussi quand le SERVEUR change (lib/, server.js, package*.json) : le
# test d'intégration Swift tourne contre le vrai server.js, il doit voir le
# serveur réellement modifié. Appelé par ios-testflight.yml avant tout envoi.
#
# Quand : sur une PR PRÊTE à fusionner (pas en brouillon), à la demande
# (Actions → Run workflow), et avant chaque envoi TestFlight. Plus à chaque
# envoi sur une branche : une minute macOS compte pour dix dans le quota
# GitHub, et c'est ce qui l'avait épuisé le 14/10.

name: iOS natif — build & captures

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "ios-native/**"
      - "lib/**"
      - "api/**"
      - "server.js"
      - "package.json"
      - "package-lock.json"
      - "contrat/**"
      - ".github/workflows/ios-native.yml"
      - ".github/actions/outils-ios/**"
  workflow_call:
    inputs:
      essentiel:
        description: "Envoi TestFlight : tests et compilation, mais seulement les captures qui prouvent que l'app démarre (les autres ont été faites sur la PR)"
        type: boolean
        default: false
  workflow_dispatch:

concurrency:
  group: ios-native-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-26
    timeout-minutes: 90
    env:
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4

      # Xcode et XcodeGen en versions figées (les mêmes que pour TestFlight).
      - uses: ./.github/actions/outils-ios

      # Le serveur s'appuie sur node:sqlite (Node ≥ 22.13), comme sur la tour.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Serveur de démo (données fictives)
        run: |
          npm ci --omit=dev --ignore-scripts
          node ios-native/ci/donnees-demo.mjs
          nohup node ios-native/ci/faux-services.mjs > faux.log 2>&1 &
          APP_PASSWORD=demo-demo-demo SESSION_SECRET=ci ANTHROPIC_API_KEY=sk-ci \
          MOTION_API_KEY=faux MOTION_BASE_URL=http://127.0.0.1:9998/v1 \
          GOOGLE_CLIENT_ID=x GOOGLE_CLIENT_SECRET=y \
          GOOGLE_API_URL=http://127.0.0.1:9995/calendar/v3 GOOGLE_TOKEN_URL=http://127.0.0.1:9995/token \
          DICTEE_LOCALE_URL=http://127.0.0.1:9997 REMY_ACTIVITYWATCH_URL=http://127.0.0.1:9993 \
          REMY_GLM_URL=http://127.0.0.1:9994/v1 REMY_CERVEAU=cloud REMY_PLANIF=off \
          CRON_SECRET=ci REMY_ENV=test PORT=3000 nohup node server.js > serveur.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/api/health > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:3000/api/health > /dev/null

      - name: Tests du cœur (contre le serveur de démo)
        working-directory: ios-native/RemyCore
        env:
          REMY_TEST_URL: http://127.0.0.1:3000
          REMY_TEST_MDP: demo-demo-demo
        # pipefail : sans lui, « tail » réussit toujours et un test rouge passait vert.
        run: |
          set -o pipefail
          swift test 2>&1 | grep -E "error:|failed|XCTAssert|Executed|INTEGRATION" | tail -60

      - name: Générer le projet Xcode
        working-directory: ios-native
        run: xcodegen generate

      - name: Compiler pour le simulateur
        working-directory: ios-native
        run: |
          set -o pipefail
          xcodebuild -project Remy.xcodeproj -scheme Remy -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 \
            | grep -E "error:|warning: .*Remy/|BUILD (SUCCEEDED|FAILED)" || true
          # L'exécutable, pas seulement le dossier : un échec de compilation laisse
          # un Remy.app vide, que l'installation refusait bien plus loin.
          test -f build/Build/Products/Debug-iphonesimulator/Remy.app/Remy

      - name: Lancer et capturer
        working-directory: ios-native
        env:
          ESSENTIEL: ${{ inputs.essentiel && '1' || '' }}
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          ios=[(k,v) for k,v in d.items() if 'iOS' in k]
          ios.sort(key=lambda kv: kv[0])
          # Le runtime iOS le plus récent ; un grand iPhone (« Pro Max », sinon
          # « Plus ») comme celui de Sam, sinon un « Pro ».
          for k,v in reversed(ios):
              iphones=[d for d in v if d['name'].startswith('iPhone')]
              grands=[d for d in iphones if d['name'].endswith(' Pro Max')] or [d for d in iphones if d['name'].endswith(' Plus')]
              pro=[d for d in iphones if d['name'].endswith(' Pro')]
              choix=(grands or pro or iphones)
              if choix:
                  print(choix[-1]['udid']); sys.exit()
          ")
          echo "Simulateur : $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Remy.app
          # Le micro (dictée, mode appel) : accordé d'avance, sinon l'alerte
          # système masquerait les captures.
          xcrun simctl privacy "$UDID" grant microphone com.pingureep.remy || true
          # Sans quoi le premier clavier affiche l'astuce « Speed up your typing… ».
          xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true || true
          mkdir -p captures
          capture() { # nom apparence écran
            xcrun simctl ui "$UDID" appearance "$2"
            xcrun simctl terminate "$UDID" com.pingureep.remy 2>/dev/null || true
            if [ "$3" = "adresse" ]; then
              # Premier lancement sans adresse de tour connue : l'app la demande.
              xcrun simctl launch "$UDID" com.pingureep.remy
            elif [ "$3" = "connexion" ]; then
              SIMCTL_CHILD_REMY_BASE_URL=http://127.0.0.1:3000 xcrun simctl launch "$UDID" com.pingureep.remy
            else
              SIMCTL_CHILD_REMY_BASE_URL=http://127.0.0.1:3000 SIMCTL_CHILD_REMY_DEMO_MDP=demo-demo-demo \
              SIMCTL_CHILD_REMY_DEMO_ECRAN="$3" SIMCTL_CHILD_REMY_DEMO_ANCRE="${4:-}" \
              xcrun simctl launch "$UDID" com.pingureep.remy
            fi
            sleep 9
            xcrun simctl io "$UDID" screenshot "captures/$1.png"
            # Une capture ne prouve rien si l'app est tombée entre-temps : elle
            # doit TOURNER encore, sinon la CI échoue (crash au lancement).
            # (liste lue d'abord : « grep -q » en bout de tube coupait launchctl, « Broken pipe »)
            EN_COURS=$(xcrun simctl spawn "$UDID" launchctl list)
            if ! grep -q "com.pingureep.remy" <<<"$EN_COURS"; then
              echo "::error::L'app ne tourne plus après la capture « $1 » (crash ?)"
              exit 1
            fi
          }
          if [ "$ESSENTIEL" = "1" ]; then
            # Envoi TestFlight : ce code a déjà eu toutes ses captures sur la PR
            # (31 min sur 36). Ici, de quoi prouver que l'app démarre, se connecte
            # et ne plante pas (chaque capture le vérifie).
            capture 0-adresse-tour-clair light adresse
            capture 2-aujourdhui-clair light aujourdhui
            capture 4-remy-clair light remy
            ls -la captures
            exit 0
          fi
          capture 0-adresse-tour-clair light adresse
          capture 1-connexion-sombre dark connexion
          capture 2-aujourdhui-clair light aujourdhui
          capture 3-aujourdhui-sombre dark aujourdhui
          capture 3b-journee-clair light aujourdhui journee
          capture 3c-boite-sombre dark boite
          capture 3d-connaissance-clair light aujourdhui connaissance
          capture 3e-gerer-clair light gerer
          capture 3f-journee-etendue-clair light journee-etendue
          capture 3g-capture-clair light capture
          capture 3h-projets-clair light projets
          capture 3i-projets-sombre dark projets
          capture 3j-liste-clair light liste
          capture 3k-rappels-sombre dark rappels
          capture 3l-capture-liste-clair light capture-liste
          capture 3m-capture-rappel-sombre dark capture-rappel
          capture 3n-modifier-clair light modifier
          capture 3o-a-traiter-sombre dark aujourdhui a-traiter
          capture 3p-conseil-clair light conseil
          capture 3q-conseil-sombre dark conseil
          capture 3r-activite-clair light activite
          capture 3s-rendez-vous-sombre dark rendez-vous
          capture 3t-et-maintenant-clair light et-maintenant
          capture 3u-choix-tache-sombre dark choix-tache
          capture 3v-capture-plusieurs-clair light capture-plusieurs
          capture 3w-capture-projet-sombre dark capture-projet
          capture 3x-filtre-rappels-clair light filtre
          capture 3y-onboarding-rappels-clair light onboarding
          capture 3z-onboarding-rappels-2-sombre dark onboarding-2
          capture 3za-historique-clair light historique
          capture 3zb-projet-motion-sombre dark noeud motion:p1
          capture 3zc-sous-projet-clair light noeud d-site
          capture 4-remy-clair light remy
          capture 4b-remy-sombre dark remy
          capture 4c-recherche-web-sombre dark remy-fil c6
          capture 5-remy-vide-clair light remy-vide
          capture 5b-conversations-clair light conversations
          capture 5c-conversations-sombre dark conversations
          capture 5d-retenir-clair light retenir
          capture 5e-proposition-clair light remy-fil c10
          capture 5f-ajuster-clair light ajuster c10
          capture 5g-ajuster-rappel-sombre dark ajuster-rappel c10
          capture 5h-categorie-tache-clair light categorie
          capture 5i-corriger-dictee-clair light corriger-dictee
          capture 5j-etapes-sombre dark etapes
          capture 5k-tableau-clair light remy-fil c12
          capture 5l-jauge-clair light jauge
          capture 5m-erreur-sombre dark erreur
          capture 5n-regle-clair light regle
          capture 6b-lieux-clair light lieux
          capture 6c-modele-sombre dark modeles
          capture 6d-nouveautes-clair light nouveautes
          capture 6e-nouveautes-liste-sombre dark nouveautes-liste
          capture 6f-activite-pc-clair light activite-pc
          capture 6g-nouveautes-activite-pc-sombre dark nouveautes-activite-pc
          capture 6-reglages-sombre dark reglages
          capture 7-appel-sombre dark appel
          capture 8-dictee-clair light dictee
          capture 8b-vocal-en-attente-sombre dark vocal-en-attente
          # Feuille de partage (24/10), montrée dans l'app contre la tour de
          # démo : un lien (comme Safari), une image lue par Vision, son reçu
          # après envoi, une tour injoignable (Copier, Réessayer).
          capture 8e-partage-lien-clair light partage-lien
          capture 8f-partage-image-sombre dark partage-image
          capture 8g-partage-recu-clair light partage-recu
          capture 8h-partage-erreur-sombre dark partage-erreur
          # Mesure de la frappe (Sam, 18/10 : touches lentes après une longue
          # dictée). Les chiffres sortent dans le journal et sur la capture.
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl terminate "$UDID" com.pingureep.remy 2>/dev/null || true
          SIMCTL_CHILD_REMY_DEMO_ECRAN=perf-saisie \
            xcrun simctl launch --stdout="$PWD/perf-saisie.log" --stderr="$PWD/perf-saisie.log" "$UDID" com.pingureep.remy
          for i in $(seq 1 60); do grep -q "dictée de 2 min" perf-saisie.log 2>/dev/null && [ "$(grep -c PERF-SAISIE perf-saisie.log)" -ge 3 ] && break; sleep 1; done
          sleep 1
          xcrun simctl io "$UDID" screenshot captures/8b-mesure-frappe-clair.png
          # Dans le vrai écran (fil de 60 messages, composeur réel) : garde-fou
          # de régression (le 18/10, le champ SwiftUI y faisait 96,6 ms par image).
          for champ in uikit; do
            xcrun simctl terminate "$UDID" com.pingureep.remy 2>/dev/null || true
            SIMCTL_CHILD_REMY_BASE_URL=http://127.0.0.1:3000 SIMCTL_CHILD_REMY_DEMO_MDP=demo-demo-demo \
            SIMCTL_CHILD_REMY_DEMO_ECRAN=perf-remy SIMCTL_CHILD_REMY_DEMO_ANCRE=$champ \
              xcrun simctl launch --stdout="$PWD/perf-remy-$champ.log" --stderr="$PWD/perf-remy-$champ.log" "$UDID" com.pingureep.remy
            for i in $(seq 1 40); do grep -q PERF-SAISIE "perf-remy-$champ.log" 2>/dev/null && break; sleep 1; done
            xcrun simctl io "$UDID" screenshot "captures/8c-mesure-vrai-ecran-$champ.png"
            cat "perf-remy-$champ.log" >> perf-saisie.log
          done
          grep PERF-SAISIE perf-saisie.log | while read -r l; do echo "::notice::$l"; done
          grep -q PERF-SAISIE perf-saisie.log || echo "::warning::Mesure de la frappe : pas de résultat"
          # Petit écran (iPhone SE, sinon le plus petit disponible) : textes
          # longs, défilement, zones tactiles.
          PETIT=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          ios=sorted([(k,v) for k,v in d.items() if 'iOS' in k], key=lambda kv: kv[0])
          for k,v in reversed(ios):
              iphones=[x for x in v if x['name'].startswith('iPhone')]
              for motif in (' SE', ' mini', 'e'):
                  petits=[x for x in iphones if motif in x['name'] or (motif=='e' and x['name'].split()[-1].endswith('e'))]
                  if petits:
                      print(petits[-1]['udid']); sys.exit()
          ")
          if [ -n "$PETIT" ] && [ "$PETIT" != "$UDID" ]; then
            echo "Petit écran : $PETIT"
            xcrun simctl boot "$PETIT" || true
            xcrun simctl bootstatus "$PETIT" -b
            xcrun simctl status_bar "$PETIT" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4
            xcrun simctl install "$PETIT" build/Build/Products/Debug-iphonesimulator/Remy.app
            GRAND=$UDID
            UDID=$PETIT
            capture 10-petit-aujourdhui-clair light aujourdhui
            capture 10b-petit-suite-clair light aujourdhui journee
            capture 10c-petit-gerer-sombre dark gerer
            capture 10d-petit-capture-clair light capture
            capture 10e-petit-projets-sombre dark projets
            capture 10f-petit-liste-sombre dark liste
            capture 10g-petit-capture-rappel-clair light capture-rappel
            capture 10h-petit-conseil-clair light conseil
            capture 10i-petit-activite-sombre dark activite
            capture 10j-petit-capture-plusieurs-clair light capture-plusieurs
            capture 10k-petit-onboarding-2-sombre dark onboarding-2
            capture 10l-petit-sous-projet-clair light noeud d-site
            capture 10m-petit-remy-clair light remy
            capture 10n-petit-retenir-sombre dark retenir
            capture 10o-petit-ajuster-sombre dark ajuster c10
            UDID=$GRAND
            xcrun simctl shutdown "$PETIT" || true
          else
            echo "::warning::Aucun petit iPhone dans ce runtime : captures petit écran sautées"
          fi
          # J1.2 : la tour s'éteint. L'app relancée montre la journée gardée sur
          # l'iPhone, datée, et une coche faite à ce moment attend le réseau.
          pkill -f "node serve[r].js" || true
          sleep 1
          capture 9-tour-coupee-clair light aujourdhui
          capture 9b-coche-en-attente-clair light cocher
          capture 9c-coche-en-attente-sombre dark aujourdhui
          ls -la captures

      - name: Captures en JPEG réduit
        if: always()
        working-directory: ios-native
        run: |
          mkdir -p captures/petites
          for f in captures/*.png; do [ -f "$f" ] && sips -s format jpeg -s formatOptions 70 -Z 1000 "$f" --out "captures/petites/$(basename "${f%.png}").jpg" > /dev/null; done
          ls -la captures/petites || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-iphone
          path: ios-native/captures/petites/
          retention-days: 14

      - name: Journaux du serveur de démo
        if: failure()
        run: tail -40 serveur.log faux.log || true
