<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rémy</title>
<meta name="description" content="Rémy — ton directeur de cabinet personnel.">
<meta name="theme-color" content="#F4EFE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14120F" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rémy">
<link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/source-serif-4-latin-600.woff2" as="font" type="font/woff2" crossorigin>
<script>
  // Thème choisi à la main (Réglages › Apparence) : appliqué AVANT le premier
  // rendu, sinon l'écran clignote du clair au sombre à chaque ouverture.
  (function () {
    try {
      var t = localStorage.getItem("remy-theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
    if (/[?&]fenetre=noter\b/.test(location.search)) document.documentElement.className = "fenetre-noter-html";
  })();
</script>
<link rel="stylesheet" href="/app/atelier.css">
<style>
  /* Le tout premier écran, avant le JavaScript : le papier et la marque. */
  .demarrage { min-height: 100dvh; display: grid; place-items: center; }
  .demarrage .marque-r { width: 52px; height: 52px; border-radius: 15px; font-size: 28px; animation: respire 1.8s ease-in-out infinite; }
  .fenetre-noter-html .demarrage { min-height: 200px; }
</style>
</head>
<body>
<div id="app" class="demarrage" aria-busy="true">
  <span class="marque-r" aria-label="Rémy se prépare">R</span>
</div>
<noscript>
  <p style="padding:24px;font:16px/1.5 system-ui">Rémy a besoin de JavaScript. Active-le, ou ouvre l'<a href="/classique.html">interface classique</a>.</p>
</noscript>
<script type="module" src="/app/main.js"></script>
</body>
</html>
