# App iPhone native de Rémy. Le projet Xcode est GÉNÉRÉ à partir de ce fichier
# (XcodeGen) : on ne versionne pas de .xcodeproj, qui serait illisible en revue.
#   brew install xcodegen && xcodegen generate
name: Remy
options:
  bundleIdPrefix: com.pingureep
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: fr
packages:
  RemyCore:
    path: RemyCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Remy:
    type: application
    platform: iOS
    sources:
      - path: Remy
      # La feuille de partage, aussi dans l'app pour les captures de la CI
      # (REMY_DEMO_ECRAN=partage-…) : l'extension ne se lance pas en ligne de
      # commande dans le simulateur.
      - path: RemyPartage/FeuillePartage.swift
      - path: RemyPartage/LecturePartage.swift
      - path: Commun/Teinte.swift
      # Intentions partagées avec les widgets (activité en direct, contrôle).
      - path: Intentions
    dependencies:
      - package: RemyCore
      # Embarquées dans l'app (PlugIns) : widgets et feuille de partage (24/10).
      - target: RemyWidgets
      - target: RemyPartage
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Rémy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: fr
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        # iOS 26 applique d'office l'effet « Liquid Glass » aux éléments système
        # (feuilles, alertes, menus). Le design de Rémy est plat et à angles
        # droits : on garde l'apparence classique, cohérente avec le site.
        UIDesignRequiresCompatibility: true
        # Activités en direct (écran verrouillé, Dynamic Island) : 24/10.
        NSSupportsLiveActivities: true
        # remy://capture (widget, raccourci) ouvre la capture ; remy://projets…
        # ouvre l'onglet (LienRemy dans RemyCore).
        CFBundleURLTypes:
          - CFBundleURLName: com.pingureep.remy
            CFBundleURLSchemes:
              - remy
        # L'adresse de la tour, posée à la compilation (secret de la CI) ; vide :
        # l'app la demande une fois. Jamais écrite dans le dépôt.
        RemyAdresseTour: $(REMY_ADRESSE_TOUR)
        # HTTP autorisé UNIQUEMENT vers le réseau local (serveur de démo de la
        # CI, serveur de dev) ; la production reste en HTTPS obligatoire.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Dictée et mode appel : l'audio part vers la tour (Dictée Locale) pour
        # être transcrit, puis il est effacé — jamais conservé.
        # Import des rappels de l'iPhone (J1.5) : lus sur l'iPhone, envoyés à la
        # tour, nulle part ailleurs ; rien n'est effacé côté Apple.
        NSRemindersFullAccessUsageDescription: "Pour reprendre tes rappels dans Rémy : ils sont lus sur l'iPhone et envoyés à ta tour, nulle part ailleurs. Rien n'est effacé dans l'app Rappels."
        NSMicrophoneUsageDescription: "Rémy t'écoute quand tu dictes un message ou que tu l'appelles. L'audio part seulement vers ta tour pour être transcrit, puis il est effacé."
        # Localisation (20/10) : visites et trajets, envoyés à la tour seulement ;
        # les adresses y sont traduites, rien ne part chez Apple ni ailleurs.
        NSLocationWhenInUseUsageDescription: "Pour que Rémy sache où tu en es dans ta journée (à la maison, à la salle, sur la route). Tes positions vont seulement à ta tour."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Pour reconnaître tes arrivées et départs même app fermée (iOS les détecte, presque sans batterie). Tes positions vont seulement à ta tour, gardées 90 jours."
        NSMotionUsageDescription: "Pour savoir quand tu es en voiture, et que Rémy ne t'envoie rien de long à lire au volant. Rien ne quitte ta tour."
        UILaunchScreen:
          UIColorName: Fond
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Inter-Bold.ttf
          - Inter-ExtraBold.ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-SemiBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pingureep.remy
        PRODUCT_NAME: Remy
        # Trousseau partagé avec les extensions (pas de groupe d'app : Apple
        # refuse de l'enregistrer par l'API). Son groupe est celui par défaut de
        # l'app : le jeton déjà rangé reste lisible.
        CODE_SIGN_ENTITLEMENTS: Remy/Remy.entitlements
        REMY_ADRESSE_TOUR: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES

  # Widgets (WidgetKit, 24/10). Même version que l'app (TestFlight l'exige),
  # même équipe et signature automatique (DEVELOPMENT_TEAM vient de la CI).
  # Lit seulement le trousseau partagé (adresse de la tour, jeton).
  RemyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: RemyWidgets
      - path: Commun
      - path: Intentions
    dependencies:
      - package: RemyCore
    info:
      path: Support/RemyWidgets-Info.plist
      properties:
        CFBundleDisplayName: Rémy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: fr
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pingureep.remy.widgets
        PRODUCT_NAME: RemyWidgets
        CODE_SIGN_ENTITLEMENTS: RemyWidgets/RemyWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  # Feuille de partage (24/10) : un texte, un lien ou une image vers Rémy
  # (RemyPartage/FeuillePartage.swift). Lit seulement le trousseau partagé.
  RemyPartage:
    type: app-extension
    platform: iOS
    sources:
      - path: RemyPartage
      - path: Commun
    dependencies:
      - package: RemyCore
    info:
      path: Support/RemyPartage-Info.plist
      properties:
        CFBundleDisplayName: Rémy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: fr
        UIDesignRequiresCompatibility: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PartageViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pingureep.remy.partage
        PRODUCT_NAME: RemyPartage
        CODE_SIGN_ENTITLEMENTS: RemyPartage/RemyPartage.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
